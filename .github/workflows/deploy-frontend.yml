name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infrastructure/lib/frontend.ts"
      - "infrastructure/lib/config/cloudfront-config.ts"
      - "infrastructure/lib/cloudfront-functions/**"
      - ".github/workflows/deploy-frontend.yml"

env:
  ENVIRONMENT: prod
  # configure-aws-credentials exports AWS_REGION. The CDK CLI copies it to
  # CDK_DEFAULT_REGION, so this job updates EribertoLopez-Frontend-Stack in
  # us-east-1. bin/infrastructure.ts falls back to us-west-2 only when that
  # variable is unset. The imported ACM certificate must also be us-east-1.
  AWS_REGION: us-east-1

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install infrastructure dependencies
        run: cd infrastructure && npm ci

      - name: Build frontend
        run: npm run frontend:build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: CDK deploy frontend
        env:
          CLOUDFRONT_CERTIFICATE_ARN: ${{ secrets.CLOUDFRONT_CERTIFICATE_ARN }}
        run: |
          if [ -n "$CLOUDFRONT_CERTIFICATE_ARN" ]; then
            echo "CLOUDFRONT_CERTIFICATE_ARN is set. eribertolopez.com and www will be attached."
          else
            echo "CLOUDFRONT_CERTIFICATE_ARN is unset. Deploying without alternate domain names."
          fi
          npm run deploy:frontend
