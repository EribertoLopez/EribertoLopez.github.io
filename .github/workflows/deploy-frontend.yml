name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infrastructure/lib/frontend.ts"
      - "infrastructure/lib/config/cloudfront-config.ts"
      - "infrastructure/lib/cloudfront-functions/**"
      - ".github/workflows/deploy-frontend.yml"

env:
  ENVIRONMENT: prod
  # configure-aws-credentials exports AWS_REGION. The CDK CLI copies it to
  # CDK_DEFAULT_REGION, so this job updates EribertoLopez-Frontend-Stack in
  # us-east-1. bin/infrastructure.ts falls back to us-west-2 only when that
  # variable is unset. The ACM certificate is created in that same stack.
  AWS_REGION: us-east-1

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    # GitHub-hosted runners cap a job at 360 minutes. CloudFormation itself
    # keeps a DNS-validated certificate IN_PROGRESS for up to about 72 hours.
    # Add the Namecheap CNAMEs while this job is still running when you can.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install infrastructure dependencies
        run: cd infrastructure && npm ci

      - name: Build frontend
        run: npm run frontend:build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: CDK deploy frontend
        env:
          CLOUDFRONT_CERTIFICATE_ARN: ${{ secrets.CLOUDFRONT_CERTIFICATE_ARN }}
        run: |
          if [ -n "$CLOUDFRONT_CERTIFICATE_ARN" ]; then
            echo "CLOUDFRONT_CERTIFICATE_ARN is set. Importing that certificate and skipping ACM creation."
          else
            echo "Prod deploy creates the DNS-validated certificate for eribertolopez.com and www.eribertolopez.com."
            echo "The first deploy waits until the Namecheap validation CNAMEs are in place."
            echo "Validation names show in the ACM console and in the CloudFormation certificate events."
            echo "This job ends at 6 hours. CloudFormation can keep waiting for about 72 hours."
          fi
          npm run deploy:frontend
