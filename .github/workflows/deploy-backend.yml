name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

env:
  ENVIRONMENT: dev

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm run backend:install --if-present || (cd backend && npm ci)

      - name: Build backend
        run: npm run backend:build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install infrastructure dependencies
        run: cd infrastructure && npm ci

      - name: CDK deploy backend
        env:
          INTERNAL_VPC_CONFIG: ${{ vars.INTERNAL_VPC_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${INTERNAL_VPC_CONFIG}" ]; then
            echo "Skipping backend CDK. INTERNAL_VPC_CONFIG is not set."
            echo "Deployed environments import an existing VPC and do not create one."
            echo "Set the repository Actions variable INTERNAL_VPC_CONFIG to JSON {\"vpcConfig\":{\"dev\":{...}}} before this job can deploy."
            echo "Use real VPC, subnet, and security group ids. infrastructure/bin/vpc-dev-config.json shows the shape only."
            exit 0
          fi
          npm run deploy:backend
